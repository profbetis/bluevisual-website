baseurl: https://bluevisual.tv/

locale: en-us

title: Blue Visual Website v04

publishdir: docs

module:
  mounts:
  - source: content
    target: content
    files:
    - '! docs/*'
    - '! **/_archive/*'
  - source: static
    target: static
    files:
      - '! **/_archive/*'
  - source: assets
    target: assets
  - source: layouts
    target: layouts

pygmentsuseclasses: true
